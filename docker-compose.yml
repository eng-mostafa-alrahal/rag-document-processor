# Shared local infrastructure (Postgres, Redis, MinIO).
# Not RAG-specific — any local service (including rag-document-processor) can join `shared-net`.
#
#   docker compose up -d
#
name: shared-infra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [shared-net]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [shared-net]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks: [shared-net]

volumes:
  # Stable names so data survives compose project renames.
  pgdata:
    name: rag-document-processor_pgdata
  miniodata:
    name: rag-document-processor_miniodata

networks:
  shared-net:
    name: shared-net
